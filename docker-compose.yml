services:
  postgres:
    image: postgres:17
    container_name: starter-template-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5452:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d example"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  postgres-data:
